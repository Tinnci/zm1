[project]
name = "ha-zm1"
version = "0.2.1"
description = "Home Assistant custom integration for zM1 UDP and MQTT control"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
override-dependencies = [
    "cryptography>=50.0.0,<51",
    "pillow>=12.3.0,<13",
    "pyjwt>=2.13.0,<3",
]

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.348",
    "ruff>=0.15.14",
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.14.2,<3.15"}

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
