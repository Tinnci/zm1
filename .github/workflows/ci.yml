name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Integration and UDP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check
      - name: Build installable archive
        run: uv run python scripts/build_release_package.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: hacs/action@22.5.0
        env:
          REPOSITORY_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
